{% extends "accounts/base.html" %}
{% block title %}Popular Users{% endblock %}
{% block content %}
<h1>Popular Users</h1>

{% for user in popular_users %}
  <div class="card">
    <p>
      <strong>{{ user.username }}</strong><br>
      <span class="muted">{{ user.followers_count }} followers</span>
    </p>
  </div>
{% empty %}
  <p>No users yet.</p>
{% endfor %}
{% endblock %}
