<h1>Following</h1>

{% for user in following %}
  <div>
    <p>
      <strong>{{ user.username }}</strong><br>
      {{ user.first_name }} {{ user.last_name }}<br>

      {% if user.bio %}
        {{ user.bio }}
      {% endif %}
    </p>

    <form method="POST" action="{% url 'mutual_followers' user.django_id %}">
      {% csrf_token %}
      <button type="submit">View Mutual Followers</button>
    </form>

    <form method="POST" action="{% url 'unfollow_user' user.django_id %}">
      {% csrf_token %}
      <button type="submit">Unfollow</button>
    </form>
  </div>

  <hr>
{% empty %}
  <p>You are not following anyone yet.</p>
{% endfor %}

<a href="{% url 'home' %}">
  <button>Back Home</button>
</a>
