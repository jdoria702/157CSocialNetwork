<h1>Followers</h1>

{% for user in followers %}
  <div>
    <p>
      <strong>{{ user.username }}</strong><br>
      {{ user.first_name }} {{ user.last_name }}<br>

      {% if user.bio %}
        {{ user.bio }}
      {% endif %}
    </p>
  </div>

  <hr>
{% empty %}
  <p>No followers yet.</p>
{% endfor %}

<a href="{% url 'home' %}">
  <button>Back Home</button>
</a>
